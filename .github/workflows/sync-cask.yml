name: Sync the casks with the latest releases

# One loop for every application in this tap, driven by .github/casks.json: adding
# an app is one stanza there, not another workflow. The job runs inside the tap
# repository, whose own token can write to it, so it needs no secret and no
# personal token.
#
# Why it exists at all: a release can be cut without bumping the cask (a tag
# pushed by hand, a run on another machine). The cask then goes stale silently —
# every user's `brew upgrade` says "already up to date" while newer releases
# exist. That happened here once: this tap sat at macfan 0.2.0 while releases
# reached 0.2.5, and nothing reported it.
#
# The logic is a checked-in script rather than inline shell so it can be run and
# reviewed locally (python3 .github/sync_casks.py --dry-run).

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      cask:
        description: "Sync only this cask (leave empty for all of them)"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync every cask listed in .github/casks.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 .github/sync_casks.py "${{ inputs.cask }}"
